<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BM 영업일지 보고서 생성기</title>
  
  <!-- External Libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <!-- Global Styles (injected from styles/global.css.js) -->
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap');

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --navy: #1F4E79;
      --navy-light: #2E6DA4;
      --navy-pale: #EBF3FA;
      --green: #375623;
      --red: #C00000;
      --amber: #7F3F00;
      --gray: #595959;
      --gray-light: #F5F5F5;
      --border: #E0E0E0;
      --white: #FFFFFF;
      --text: #1a1a1a;
      --text-muted: #666;
    }

    html, body {
      height: 100%;
      background: #F0F4F8;
      font-family: 'Noto Sans KR', sans-serif;
      color: var(--text);
    }

    .app {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: var(--white);
      border-bottom: 1px solid var(--border);
      padding: 0 40px;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.06);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-icon {
      width: 36px;
      height: 36px;
      background: var(--navy);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo-icon svg {
      width: 20px;
      height: 20px;
    }

    .logo-text {
      font-size: 16px;
      font-weight: 700;
      color: var(--navy);
      letter-spacing: -0.3px;
    }

    .logo-sub {
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 300;
    }

    .header-badge {
      font-size: 12px;
      background: var(--navy-pale);
      color: var(--navy);
      padding: 4px 12px;
      border-radius: 20px;
      font-weight: 500;
    }

    main {
      flex: 1;
      padding: 40px;
      max-width: 1000px;
      width: 100%;
      margin: 0 auto;
    }

    /* Upload Section */
    .upload-section {
      background: var(--white);
      border-radius: 16px;
      padding: 48px;
      text-align: center;
      border: 2px dashed var(--border);
      transition: all 0.2s;
      cursor: pointer;
    }

    .upload-section.drag-over {
      border-color: var(--navy);
      background: var(--navy-pale);
    }

    .upload-section:hover {
      border-color: var(--navy-light);
    }

    .upload-icon {
      width: 64px;
      height: 64px;
      background: var(--navy-pale);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
    }

    .upload-icon svg {
      width: 32px;
      height: 32px;
      color: var(--navy);
    }

    .upload-title {
      font-size: 20px;
      font-weight: 700;
      color: var(--navy);
      margin-bottom: 8px;
    }

    .upload-desc {
      font-size: 14px;
      color: var(--text-muted);
      margin-bottom: 24px;
      line-height: 1.6;
    }

    .upload-hint {
      margin-top: 16px;
      font-size: 12px;
      color: #AAA;
    }

    #fileInput {
      display: none;
    }

    /* Progress Section */
    .progress-section {
      display: none;
      background: var(--white);
      border-radius: 16px;
      padding: 40px;
      text-align: center;
    }

    .progress-spinner {
      width: 48px;
      height: 48px;
      border: 3px solid var(--navy-pale);
      border-top-color: var(--navy);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 20px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .progress-title {
      font-size: 16px;
      font-weight: 600;
      color: var(--navy);
      margin-bottom: 8px;
    }

    .progress-step {
      font-size: 13px;
      color: var(--text-muted);
    }

    /* Preview Section */
    .preview-section {
      display: none;
    }

    .preview-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
      flex-wrap: wrap;
      gap: 12px;
    }

    .preview-title {
      font-size: 20px;
      font-weight: 700;
      color: var(--navy);
    }

    .preview-meta {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .btn-group {
      display: flex;
      gap: 10px;
    }

    .upload-btn,
    .btn-reset,
    .btn-download,
    .btn-claude {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      font-family: 'Noto Sans KR', sans-serif;
      transition: all 0.15s;
    }

    .upload-btn {
      background: var(--navy);
      color: white;
      border: none;
      padding: 12px 28px;
    }

    .upload-btn:hover {
      background: var(--navy-light);
    }

    .btn-reset {
      background: var(--white);
      color: var(--gray);
      border: 1px solid var(--border);
      padding: 10px 20px;
      font-size: 13px;
    }

    .btn-reset:hover {
      border-color: var(--navy);
      color: var(--navy);
    }

    .btn-download {
      background: var(--navy);
      color: white;
      border: none;
      padding: 10px 24px;
      font-weight: 600;
    }

    .btn-download:hover {
      background: var(--navy-light);
    }

    .btn-download:disabled {
      background: #aaa;
      cursor: not-allowed;
    }

    .btn-claude {
      background: #7C3AED;
      color: white;
      border: none;
      padding: 10px 20px;
      font-weight: 600;
    }

    .btn-claude:hover {
      background: #6D28D9;
    }

    .btn-claude:disabled {
      background: #aaa;
      cursor: not-allowed;
    }

    /* Report Preview */
    .report-doc {
      background: var(--white);
      border-radius: 16px;
      padding: 48px;
      box-shadow: 0 2px 16px rgba(0, 0, 0, 0.06);
    }

    .report-cover-title {
      font-size: 28px;
      font-weight: 700;
      color: var(--navy);
      text-align: center;
      margin-bottom: 8px;
    }

    .report-cover-period {
      text-align: center;
      font-size: 15px;
      color: var(--gray);
      margin-bottom: 6px;
    }

    .report-cover-sub {
      text-align: center;
      font-size: 13px;
      color: #AAA;
      padding-bottom: 24px;
      border-bottom: 3px solid var(--navy);
      margin-bottom: 32px;
    }

    .section-heading {
      font-size: 16px;
      font-weight: 700;
      color: var(--navy);
      padding-bottom: 8px;
      border-bottom: 2px solid var(--navy);
      margin: 28px 0 16px;
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-bottom: 8px;
    }

    .summary-card {
      background: var(--navy);
      border-radius: 8px;
      padding: 14px;
      text-align: center;
    }

    .summary-card-label {
      font-size: 11px;
      color: rgba(255, 255, 255, 0.7);
      margin-bottom: 6px;
    }

    .summary-card-value {
      font-size: 18px;
      font-weight: 700;
      color: white;
    }

    .summary-card-sub {
      font-size: 10px;
      color: rgba(255, 255, 255, 0.6);
      margin-top: 3px;
    }

    .data-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      margin-bottom: 8px;
    }

    .data-table th {
      background: var(--navy);
      color: white;
      padding: 10px 12px;
      text-align: center;
      font-weight: 600;
      font-size: 12px;
    }

    .data-table td {
      padding: 9px 12px;
      border-bottom: 1px solid var(--border);
      text-align: center;
    }

    .data-table tr:last-child td {
      border-bottom: none;
    }

    .data-table tr:hover td {
      background: var(--gray-light);
    }

    .td-left {
      text-align: left !important;
    }

    .td-bold {
      font-weight: 600;
    }

    .c-navy { color: var(--navy); }
    .c-green { color: var(--green); }
    .c-red { color: var(--red); }
    .c-amber { color: var(--amber); }

    .insight-block {
      margin-bottom: 16px;
    }

    .insight-label {
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .insight-label::before {
      content: '';
      display: inline-block;
      width: 4px;
      height: 16px;
      border-radius: 2px;
      flex-shrink: 0;
    }

    .insight-label.danger {
      color: var(--red);
    }

    .insight-label.danger::before {
      background: var(--red);
    }

    .insight-label.info {
      color: var(--navy);
    }

    .insight-label.info::before {
      background: var(--navy);
    }

    .insight-label.success {
      color: var(--green);
    }

    .insight-label.success::before {
      background: var(--green);
    }

    .insight-label.warn {
      color: var(--amber);
    }

    .insight-label.warn::before {
      background: var(--amber);
    }

    .insight-bullets {
      list-style: none;
      padding-left: 12px;
    }

    .insight-bullets li {
      font-size: 13px;
      line-height: 1.7;
      color: var(--text);
      padding: 3px 0 3px 14px;
      position: relative;
    }

    .insight-bullets li::before {
      content: '●';
      position: absolute;
      left: 0;
      font-size: 8px;
      top: 6px;
      color: var(--navy);
    }

    .footer-note {
      border-top: 1px solid var(--border);
      margin-top: 32px;
      padding-top: 12px;
      text-align: right;
      font-size: 11px;
      color: #AAA;
    }

    .error-box {
      display: none;
      background: #FFF5F5;
      border: 1px solid #FFCCCC;
      border-radius: 8px;
      padding: 16px 20px;
      color: var(--red);
      font-size: 13px;
      margin-top: 16px;
    }

  </style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo">
      <div class="logo-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <polyline points="14,2 14,8 20,8"/>
          <line x1="16" y1="13" x2="8" y2="13"/>
          <line x1="16" y1="17" x2="8" y2="17"/>
          <polyline points="10,9 9,9 8,9"/>
        </svg>
      </div>
      <div>
        <div class="logo-text">BM 영업일지 보고서 생성기</div>
        <div class="logo-sub">iM라이프 방카슈랑스 영업본부</div>
      </div>
    </div>
    <div class="header-badge">Word 자동 생성</div>
  </header>

  <main>
    <div id="errorContainer"></div>
    <div id="uploadContainer"></div>
    <div id="progressContainer"></div>
    <div id="previewContainer"></div>
  </main>
</div>

<!-- Application Entry Point -->
<script type="module" src="app.js"></script>
</body>
</html>
